name: freebsd

# Native FreeBSD build + test. GitHub-hosted runners have no BSD image,
# and the vendored OpenSSL/libcurl C sources do NOT cross-compile from
# Linux to FreeBSD (they reach for FreeBSD-only kernel headers like
# crypto/cryptodev.h that aren't in a Linux cross sysroot). So we build
# natively inside a FreeBSD VM via vmactions.
#
# The VM is emulated, so this is slow (~15-25 min incl. the one-time
# OpenSSL + libcurl C build). It is therefore NOT on every PR push by
# default — run it on PRs that touch platform-sensitive code, on demand
# via the Actions UI, or as the post-merge guard on main.

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/freebsd.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notice_head_sha:
        description: 'Full independently reviewed PR8 head for selected diagnostic'
        required: false
        type: string
      release_parity:
        description: 'Run separate no-publish release-layout tar and OCI byte parity diagnostic'
        required: false
        type: boolean
        default: false
      base_custody:
        description: 'Run separate no-publish amd64/arm64 base notice and payload custody diagnostic'
        required: false
        type: boolean
        default: false

jobs:
  freebsd:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/fix/native-notice-packaging-pr5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build + test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          # No `release:` pin — vmactions sometimes lags the FreeBSD
          # release cadence (image bucket doesn't include the most recent
          # point release). Letting the action pick its own default avoids
          # SSH-into-VM failures (exit 101) on images it doesn't actually
          # ship. If we ever need to pin, check
          # https://github.com/vmactions/freebsd-vm for the current list
          # of supported releases.
          usesh: true
          # Native toolchain for the vendored C deps:
          #   gmake  — OpenSSL's generated Makefile needs GNU make.
          #   perl5  — OpenSSL's Configure is perl.
          #   git    — the `git` crate's tests shell out to git(1).
          #   curl + ca_root_nss — fetch rustup over TLS.
          prepare: |
            pkg install -y curl ca_root_nss gmake perl5 git coreutils
          # rustup honours rust-toolchain.toml (channel 1.94.1), so the
          # FreeBSD build uses the exact toolchain Linux CI does. cargo
          # stays --offline against vendor/; only rustup hits the network.
          run: |
            set -e
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"
            echo "::group::toolchain"
            rustc -V
            cargo -V
            echo "::endgroup::"
            # Build the binary — this is the real "does it build on BSD"
            # test: it compiles + links the vendored OpenSSL and libcurl
            # natively.
            cargo build --locked --frozen --offline -p cli
            ./target/debug/agent --version
            ./target/debug/agent run --mock "hello from freebsd"
            # Platform-sensitive crates: fstools (O_NOFOLLOW atomic write,
            # hard-link detection), git (shells out to git(1)), vshell
            # (process exec), wire (SIMD vs scalar dispatch). Full-workspace
            # test is skipped here — too slow under VM emulation.
            cargo test --locked --frozen --offline -p fstools -p git -p vshell -p wire
            # This disposable VM is the outer owner for the selected native
            # owner/FIFO fixtures. Each exact test has a separate watchdog;
            # the private owner_fixture_entry must only run as a child.
            command -v gtimeout
            test -x "$PWD/target/debug/agent"
            export MOTH_OWNER_TEST_AGENT="$PWD/target/debug/agent"
            echo "owner fixture agent sha256: $(sha256 -q "$MOTH_OWNER_TEST_AGENT")"
            for owner_test in \
              exec::owned_redirect_tests::fifo_writer_open_waits_for_reader_but_observes_cancel \
              exec::owned_redirect_tests::owned_fifo_open_precedes_real_payload_and_overrides_pipeline_input \
              exec::owned_redirect_tests::fifo_writer_retains_partial_data_while_reader_progresses \
              exec::owned_redirect_tests::fifo_full_output_pipe_observes_deadline_without_blocking_write_all \
              exec::owned_redirect_tests::external_fifo_stdout_backpressure_does_not_starve_stderr_or_input \
              native_owner_tests::shell_prefix_reader_preserves_success_but_default_requires_full_input \
              native_owner_tests::zero_input_fast_exit_and_full_unicode_input_preserve_receipts \
              native_owner_tests::separate_session_and_nested_reaper_retire_without_touching_sibling_owner \
              native_owner_tests::cancel_stalled_input_does_not_wait_for_credit_or_discard_cancel \
              native_owner_tests::dropped_lease_and_failed_spawn_remain_owned_until_native_receipt \
              native_owner_tests::output_overflow_is_failure_with_confirmed_cleanup \
              native_owner_tests::owned_redirect_order_append_and_malformed_request_controls
            do
              echo "::group::native owner fixture $owner_test"
              fixture_log="$(mktemp)"
              if gtimeout --signal=TERM --kill-after=10s 90s \
                cargo test --locked --frozen --offline -p vshell --lib -- \
                --ignored --exact "$owner_test" --nocapture --test-threads=1 \
                > "$fixture_log" 2>&1; then
                cat "$fixture_log"
              else
                fixture_status=$?
                cat "$fixture_log"
                rm -f "$fixture_log"
                echo "native owner fixture failed or timed out: $owner_test ($fixture_status)" >&2
                exit "$fixture_status"
              fi
              grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$fixture_log"
              rm -f "$fixture_log"
              # A passing test must not leave its agent owner or detached
              # same-binary payload alive for the next selected fixture.
              sleep 1
              if pgrep -x agent >/dev/null || \
                pgrep -f "$PWD/target/debug/deps/vshell-[[:xdigit:]]+" >/dev/null; then
                echo "native owner fixture left a process behind: $owner_test" >&2
                exit 1
              fi
              echo "::endgroup::"
            done

  notice-placement-linux:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/native-notice-packaging-pr5' && !inputs.release_parity && !inputs.base_custody
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Fetch reviewed PR8 source without submodules
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.notice_head_sha }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          mkdir -p notice-audit
          printf '%s\n' 'INCOMPLETE' 'release_admission=NO' 'legal_admission=NO' > notice-audit/status.txt
          printf '%s\n' "$GITHUB_SHA" > notice-audit/workflow-head.txt
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name notice-audit -print -quit)"
          git init -q "$GITHUB_WORKSPACE"
          git remote add origin https://github.com/ryanmaclean/moth.git
          git -c credential.helper= fetch --no-tags --no-recurse-submodules --depth=10 origin refs/pull/8/head
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA"
          git -c submodule.recurse=false checkout --detach --force "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git cat-file -e '2ad30129a9af231b687b8821f2b9d062e41992f9^{commit}'
          test "$(git merge-base HEAD 2ad30129a9af231b687b8821f2b9d062e41992f9)" = '2ad30129a9af231b687b8821f2b9d062e41992f9'
          git diff --name-only 2ad30129a9af231b687b8821f2b9d062e41992f9 HEAD | sort > notice-audit/changed-paths.txt
          printf '%s\n' '.github/workflows/freebsd.yml' '.github/workflows/release.yml' 'Dockerfile' 'Dockerfile.release' 'packaging/native-notice-files.txt' | sort | diff -u - notice-audit/changed-paths.txt
          printf '%s\n' \
            'befd91e188696989d415870792acb3f9fa5a5d3bd79fe8823989264714b6fe51  Cargo.lock' \
            '392a5a80e863151504fa05add58ea97b98a4a7a57e36cd26436734a95465650a  Dockerfile' \
            'ae3f5acdad3187723f7779ae725467a51d80e2609f6c509c8ab43c935b3f58a6  .github/workflows/release.yml' \
            '8aecec600179b49cd5a1a8a4feede8e86c1fa2717c75752827201f476bf0ef4a  Dockerfile.release' \
            '6321279cc4a58259e29638a1f7c6621184b07576e8a70728b2b5bb48d761d83c  packaging/native-notice-files.txt' \
            '59d5f1cb240a41f1a4acea088ca1f964b0e9d81c6afea1cc748988f5bdb1a533  .dockerignore' \
            | sha256sum --check --status
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'head=%s\nbase=%s\ntarget=x86_64-unknown-linux-gnu\n' "$REVIEWED_SHA" 2ad30129a9af231b687b8821f2b9d062e41992f9 > notice-audit/identity.txt

      - name: Build tar candidate using release staging layout
        shell: bash
        run: |
          set -euo pipefail
          docker build --target builder -t moth-notice-builder:diagnostic . > /tmp/moth-notice-builder.log 2>&1
          docker image inspect --format 'builder_image={{.Id}}' moth-notice-builder:diagnostic > notice-audit/images.txt
          docker run --rm moth-notice-builder:diagnostic rustc -V > notice-audit/toolchain.txt
          grep -Eq '^rustc 1\.94\.1 ' notice-audit/toolchain.txt
          docker run --rm -v "$PWD:/work" -w /work moth-notice-builder:diagnostic \
            cargo build --release --locked --frozen --offline -p cli --target x86_64-unknown-linux-gnu \
            > /tmp/moth-notice-cargo.log 2>&1
          stage=agent-notice-diagnostic-x86_64-unknown-linux-gnu
          mkdir -p "/tmp/moth-notice-audit/dist/$stage"
          docker run --rm -v "$PWD:/work" -w /work moth-notice-builder:diagnostic \
            strip target/x86_64-unknown-linux-gnu/release/agent
          cp target/x86_64-unknown-linux-gnu/release/agent "/tmp/moth-notice-audit/dist/$stage/agent"
          cp LICENSE README.md CHANGELOG.md "/tmp/moth-notice-audit/dist/$stage/"
          notice_root="/tmp/moth-notice-audit/dist/$stage/THIRD_PARTY_NOTICES/native"
          mkdir -p "$notice_root"
          test "$(wc -l < packaging/native-notice-files.txt)" -eq 14
          test "$(sort -u packaging/native-notice-files.txt | wc -l)" -eq 14
          : > notice-audit/source-text-sha256.txt
          while IFS= read -r source; do
            case "$source" in vendor/*) ;; *) exit 1 ;; esac
            case "$source" in *..*|*//*) exit 1 ;; esac
            test -f "$source" && test ! -L "$source"
            target="$notice_root/$source"
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
            cmp -s "$source" "$target"
            sha256sum "$source" >> notice-audit/source-text-sha256.txt
          done < packaging/native-notice-files.txt
          cp packaging/native-notice-files.txt "$notice_root/FILES.txt"
          tar -C /tmp/moth-notice-audit/dist -czf /tmp/moth-notice-audit/candidate.tar.gz "$stage"
          tar -tzf /tmp/moth-notice-audit/candidate.tar.gz > notice-audit/tar-members.txt
          test "$(grep -Ec "^$stage/THIRD_PARTY_NOTICES/native/.*[^/]$" notice-audit/tar-members.txt)" -eq 15
          : > notice-audit/tar-text-sha256.txt
          while IFS= read -r source; do
            member="$stage/THIRD_PARTY_NOTICES/native/$source"
            test "$(grep -Fxc "$member" notice-audit/tar-members.txt)" -eq 1
            source_hash=$(sha256sum "$source" | cut -d' ' -f1)
            member_hash=$(tar -xOzf /tmp/moth-notice-audit/candidate.tar.gz "$member" | sha256sum | cut -d' ' -f1)
            test "$member_hash" = "$source_hash"
            printf '%s  %s\n' "$member_hash" "$member" >> notice-audit/tar-text-sha256.txt
          done < packaging/native-notice-files.txt
          test "$(grep -Fxc "$stage/THIRD_PARTY_NOTICES/native/FILES.txt" notice-audit/tar-members.txt)" -eq 1
          test "$(tar -xOzf /tmp/moth-notice-audit/candidate.tar.gz "$stage/THIRD_PARTY_NOTICES/native/FILES.txt" | sha256sum | cut -d' ' -f1)" = "$(sha256sum packaging/native-notice-files.txt | cut -d' ' -f1)"
          test "$(tar -xOzf /tmp/moth-notice-audit/candidate.tar.gz "$stage/LICENSE" | sha256sum | cut -d' ' -f1)" = "$(sha256sum LICENSE | cut -d' ' -f1)"
          test "$(tar -xOzf /tmp/moth-notice-audit/candidate.tar.gz "$stage/agent" | sha256sum | cut -d' ' -f1)" = "$(sha256sum target/x86_64-unknown-linux-gnu/release/agent | cut -d' ' -f1)"
          printf 'tar_agent_sha256=%s\ntar_archive_sha256=%s\n' \
            "$(tar -xOzf /tmp/moth-notice-audit/candidate.tar.gz "$stage/agent" | sha256sum | cut -d' ' -f1)" \
            "$(sha256sum /tmp/moth-notice-audit/candidate.tar.gz | cut -d' ' -f1)" \
            > notice-audit/binary-identities.txt

      - name: Build actual OCI runtime and compare exported notice bytes
        shell: bash
        run: |
          set -euo pipefail
          docker build --target runtime -t moth-notice-runtime:diagnostic . > /tmp/moth-notice-oci.log 2>&1
          {
            docker image inspect --format 'runtime_image={{.Id}}' moth-notice-runtime:diagnostic
            docker image inspect --format 'runtime_rootfs_layers={{len .RootFS.Layers}}' moth-notice-runtime:diagnostic
            docker image inspect --format 'oci_license_label={{index .Config.Labels "org.opencontainers.image.licenses"}}' moth-notice-runtime:diagnostic
          } >> notice-audit/images.txt
          container=$(docker create moth-notice-runtime:diagnostic)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker export "$container" > /tmp/moth-notice-audit/oci-rootfs.tar
          tar -tf /tmp/moth-notice-audit/oci-rootfs.tar > /tmp/moth-notice-audit/oci-members.txt
          test "$(awk '{name=$0; sub(/^\.\//,"",name); if(name ~ /^usr\/share\/doc\/moth\/THIRD_PARTY_NOTICES\/native\// && name !~ /\/$/) print name}' /tmp/moth-notice-audit/oci-members.txt | wc -l)" -eq 15
          : > notice-audit/oci-text-sha256.txt
          while IFS= read -r source; do
            path="usr/share/doc/moth/THIRD_PARTY_NOTICES/native/$source"
            member=$(awk -v wanted="$path" '{name=$0; sub(/^\.\//,"",name); if(name==wanted) print $0}' /tmp/moth-notice-audit/oci-members.txt)
            test "$(printf '%s\n' "$member" | sed '/^$/d' | wc -l)" -eq 1
            source_hash=$(sha256sum "$source" | cut -d' ' -f1)
            member_hash=$(tar -xOf /tmp/moth-notice-audit/oci-rootfs.tar "$member" | sha256sum | cut -d' ' -f1)
            test "$member_hash" = "$source_hash"
            printf '%s  %s\n' "$member_hash" "$path" >> notice-audit/oci-text-sha256.txt
          done < packaging/native-notice-files.txt
          for relative in usr/share/doc/moth/THIRD_PARTY_NOTICES/native/FILES.txt usr/share/licenses/moth/LICENSE usr/local/bin/agent; do
            member=$(awk -v wanted="$relative" '{name=$0; sub(/^\.\//,"",name); if(name==wanted) print $0}' /tmp/moth-notice-audit/oci-members.txt)
            test "$(printf '%s\n' "$member" | sed '/^$/d' | wc -l)" -eq 1
            case "$relative" in
              */FILES.txt) test "$(tar -xOf /tmp/moth-notice-audit/oci-rootfs.tar "$member" | sha256sum | cut -d' ' -f1)" = "$(sha256sum packaging/native-notice-files.txt | cut -d' ' -f1)" ;;
              */LICENSE) test "$(tar -xOf /tmp/moth-notice-audit/oci-rootfs.tar "$member" | sha256sum | cut -d' ' -f1)" = "$(sha256sum LICENSE | cut -d' ' -f1)" ;;
              */agent) printf 'oci_agent_sha256=%s\n' "$(tar -xOf /tmp/moth-notice-audit/oci-rootfs.tar "$member" | sha256sum | cut -d' ' -f1)" >> notice-audit/binary-identities.txt ;;
            esac
          done
          tar_hash=$(sed -n 's/^tar_agent_sha256=//p' notice-audit/binary-identities.txt)
          oci_hash=$(sed -n 's/^oci_agent_sha256=//p' notice-audit/binary-identities.txt)
          if test "$tar_hash" = "$oci_hash"; then echo 'tar_oci_binary_identity=yes' >> notice-audit/binary-identities.txt; else echo 'tar_oci_binary_identity=no' >> notice-audit/binary-identities.txt; fi

      - name: Complete notice-placement diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < notice-audit/source-text-sha256.txt)" -eq 14
          test "$(wc -l < notice-audit/tar-text-sha256.txt)" -eq 14
          test "$(wc -l < notice-audit/oci-text-sha256.txt)" -eq 14
          test -s notice-audit/binary-identities.txt
          printf '%s\n' 'NATIVE_NOTICE_PLACEMENT_CANDIDATE_ONLY' 'release_admission=NO' 'legal_admission=NO' 'native_link_retention=UNPROVEN' 'base_image_notice_coverage=UNPROVEN' > notice-audit/status.txt

      - name: Bound safe notice receipts even on failure
        id: bound-notices
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d notice-audit && test ! -L notice-audit
          test -f notice-audit/status.txt
          test "$(find notice-audit -type f | wc -l)" -le 11
          test -z "$(find notice-audit ! -type f ! -type d -print -quit)"
          while IFS= read -r path; do
            case "$path" in
              notice-audit/status.txt|notice-audit/workflow-head.txt|notice-audit/changed-paths.txt|notice-audit/identity.txt|notice-audit/images.txt|notice-audit/toolchain.txt|notice-audit/source-text-sha256.txt|notice-audit/tar-members.txt|notice-audit/tar-text-sha256.txt|notice-audit/oci-text-sha256.txt|notice-audit/binary-identities.txt) ;;
              *) exit 1 ;;
            esac
            test "$(wc -c < "$path")" -le 131072
          done < <(find notice-audit -type f -print)
          test "$(du -sk notice-audit | cut -f1)" -le 1024

      - name: Retain notice placement diagnostic receipt
        if: ${{ always() && steps.bound-notices.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moth-pr8-native-notice-placement-${{ github.sha }}
          path: notice-audit/
          if-no-files-found: error
          retention-days: 7

  release-parity-linux:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/native-notice-packaging-pr5' && inputs.release_parity && !inputs.base_custody
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Fetch exact reviewed PR8 release-layout source
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.notice_head_sha }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          mkdir -p parity
          printf '%s\n' 'INCOMPLETE' 'release_admission=NO' 'legal_admission=NO' > parity/status.txt
          printf 'workflow_head=%s\n' "$GITHUB_SHA" > parity/identity.txt
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name parity -print -quit)"
          git init -q "$GITHUB_WORKSPACE"
          git remote add origin https://github.com/ryanmaclean/moth.git
          git -c credential.helper= fetch --no-tags --no-recurse-submodules --depth=64 origin refs/pull/8/head
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA"
          git -c submodule.recurse=false checkout --detach --force "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git cat-file -e '2ad30129a9af231b687b8821f2b9d062e41992f9^{commit}'
          test "$(git merge-base HEAD 2ad30129a9af231b687b8821f2b9d062e41992f9)" = '2ad30129a9af231b687b8821f2b9d062e41992f9'
          git diff --name-only 2ad30129a9af231b687b8821f2b9d062e41992f9 HEAD | sort | diff -u <(printf '%s\n' '.github/workflows/freebsd.yml' '.github/workflows/release.yml' 'Dockerfile' 'Dockerfile.release' 'packaging/native-notice-files.txt' | sort) -
          printf '%s\n' \
            'befd91e188696989d415870792acb3f9fa5a5d3bd79fe8823989264714b6fe51  Cargo.lock' \
            '392a5a80e863151504fa05add58ea97b98a4a7a57e36cd26436734a95465650a  Dockerfile' \
            '8aecec600179b49cd5a1a8a4feede8e86c1fa2717c75752827201f476bf0ef4a  Dockerfile.release' \
            'ae3f5acdad3187723f7779ae725467a51d80e2609f6c509c8ab43c935b3f58a6  .github/workflows/release.yml' \
            '6321279cc4a58259e29638a1f7c6621184b07576e8a70728b2b5bb48d761d83c  packaging/native-notice-files.txt' \
            '59d5f1cb240a41f1a4acea088ca1f964b0e9d81c6afea1cc748988f5bdb1a533  .dockerignore' \
            | sha256sum --check --status
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'source_head=%s\nbase=%s\nlock_sha256=%s\ntarget=x86_64-unknown-linux-gnu\n' \
            "$REVIEWED_SHA" 2ad30129a9af231b687b8821f2b9d062e41992f9 \
            "$(sha256sum Cargo.lock | cut -d' ' -f1)" >> parity/identity.txt

      - name: Build and verify release-layout Linux tar candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moth-parity/dist"
          printf '%s\n' BUILDER_IMAGE > parity/stage.txt
          docker build --target builder -t moth-parity-builder:diagnostic . > "$RUNNER_TEMP/moth-parity-builder.log" 2>&1
          printf '%s\n' RUSTC_IDENTITY > parity/stage.txt
          docker run --rm moth-parity-builder:diagnostic rustc -V > "$RUNNER_TEMP/moth-parity-rustc-version.log" 2>&1
          grep -Eq '^rustc 1\.94\.1 ' "$RUNNER_TEMP/moth-parity-rustc-version.log"
          docker run --rm moth-parity-builder:diagnostic rustc -vV > "$RUNNER_TEMP/moth-parity-rustc-identity.log" 2>&1
          grep -Fxq 'commit-hash: e408947bfd200af42db322daf0fadfe7e26d3bd1' "$RUNNER_TEMP/moth-parity-rustc-identity.log"
          printf '%s\n' LINKER_IDENTITY > parity/stage.txt
          linker_hash="$(docker run --rm moth-parity-builder:diagnostic sh -eu -c 'linker="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"; test -x "$linker"; version="$("$linker" -flavor gnu --version)"; case "$version" in "LLD 21.1.8 "*) ;; *) exit 1 ;; esac; hash="$(sha256sum "$linker")"; printf "%s\n" "${hash%% *}"' 2> "$RUNNER_TEMP/moth-parity-linker-identity.log")"
          test "$linker_hash" = c30db53247911b065bf8b279bbbcdf8f516702750233a6e6ef815c1826b7ee53
          printf '%s\n' CARGO_LINK_MAP > parity/stage.txt
          rm -f agent-native-link.map agent-native-why-extract.txt agent-native-archive-stats.txt
