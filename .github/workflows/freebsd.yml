                  if lines > 100000 or len(line) > 16384:
                      raise SystemExit('native map bounds')
                  # LLD 21.1.8 MapFile.cpp: output name starts at column 50;
                  # an input section adds exactly eight spaces.
                  if len(line) > 49 and line[49] == '.' and len(line.split()) == 5:
                      output_section = line[49:].strip()
                  if '.rlib(' not in line:
                      continue
                  words = line.split()
                  if len(words) != 5 or any(not re.fullmatch(r'[0-9a-fA-F]{1,16}', word) for word in words[:3]) or not re.fullmatch(r'[0-9]{1,20}', words[3]):
                      raise SystemExit('native row grammar')
                  match = re.fullmatch(r'([^\s()]+\.rlib)\(([^()]+)\):\(([^()]+)\)', words[4])
                  if match is None:
                      raise SystemExit('native member grammar')
                  archive = Path(match[1]).name
                  name = next((name for name in names if archive.startswith('lib' + name + '-')), None)
                  if name is None:
                      continue
                  if not re.fullmatch('lib' + name + r'-[0-9a-f]+\.rlib', archive):
                      raise SystemExit('native archive identity')
                  rlib_link_paths[name].add(match[1])
                  if output_section is None or line[49:] != '        ' + words[4] + '\n':
                      raise SystemExit('native output-section hierarchy')
                  vma, size = int(words[0], 16), int(words[2], 16)
                  member = match[2]
                  counters[(name, 'map_rows')] += 1
                  if size == 0:
                      counters[(name, 'zero_rows')] += 1
                      continue
                  sections = [image[2].get(output_section) for image in (before, after)]
                  if sections[0] is None:
                      raise SystemExit('native output section absent')
                  if not (sections[0][2] <= vma and vma + size <= sections[0][2] + sections[0][3]):
                      raise SystemExit('native output section range')
                  if sections[0][1] & 2 == 0 or sections[0][0] == 8:
                      counters[(name, 'nonfile_rows')] += 1
                      continue
                  if sections[1] is None or sections[1][1] & 2 == 0 or sections[1][0] == 8 or not (sections[1][2] <= vma and vma + size <= sections[1][2] + sections[1][3]):
                      raise SystemExit('allocated native section stripped')
                  old, new = slice_at(before, vma, size), slice_at(after, vma, size)
                  if (old is None) != (new is None):
                      raise SystemExit('strip load-range drift')
                  if old is None:
                      raise SystemExit('allocated native range not file backed')
                  if old != new:
                      raise SystemExit('strip mapped bytes drift')
                  ranges.append((vma, vma + size))
                  members[name].add((archive, member))
                  counters[(name, 'file_rows')] += 1
                  counters[(name, 'file_bytes')] += size
                  digests[name].update(vma.to_bytes(8, 'little') + size.to_bytes(8, 'little') + hashlib.sha256(new).digest())
                  name_hash = hashlib.sha256(member.encode()).hexdigest()
                  if name_hash not in billed[name + '_rlib']:
                      raise SystemExit('selected rlib member absent from bill')
                  native = native_by_rlib[name].get(name_hash)
                  if native is None:
                      counters[(name, 'other_rlib_file_rows')] += 1
                  else:
                      label, object_hash, object_size = native
                      if billed[name + '_rlib'][name_hash] != (object_hash, object_size):
                          raise SystemExit('selected native object byte identity')
                      selected_native[label].add(name_hash)
                      selected_rows[label].append((vma, size, name_hash, object_hash))
                      counters[(label, 'file_rows')] += 1
                      counters[(label, 'file_bytes')] += size
                  if name == 'curl_sys':
                      for stem in ('inet_ntop', 'inet_pton'):
                          if re.search(r'(?:^|-)' + stem + r'\.o$', member):
                              isc[stem] += size
          if any(len(paths) != 1 for paths in rlib_link_paths.values()):
              raise SystemExit('native rlib map path ambiguous')
          root = Path.cwd()
          def linked_path(raw):
              try:
                  if raw.startswith('/work/'):
                      return (root / raw.removeprefix('/work/')).resolve()
                  if not raw.startswith('/'):
                      return (root / raw).resolve()
                  return None
              except (OSError, RuntimeError, ValueError):
                  raise SystemExit('native extraction path invalid') from None
          stats_file = Path('agent-native-archive-stats.txt')
          why_file = Path('agent-native-why-extract.txt')
          try:
              diagnostics_in_bounds = all(path.is_file() and not path.is_symlink() and 0 < path.stat().st_size <= cap
                                          for path, cap in ((stats_file, 1048576), (why_file, 16777216)))
          except (OSError, RuntimeError, ValueError):
              raise SystemExit('native extraction diagnostics bounds') from None
          if not diagnostics_in_bounds:
              raise SystemExit('native extraction diagnostics bounds')
          try:
              stats_lines = stats_file.read_text(encoding='utf-8').splitlines()
              why_lines = why_file.read_text(encoding='utf-8').splitlines()
          except (OSError, UnicodeError, RuntimeError, ValueError):
              raise SystemExit('native extraction diagnostics unreadable') from None
          if not 1 < len(stats_lines) <= 8192 or stats_lines[0] != 'members\textracted\tarchive':
              raise SystemExit('native rlib stats header')
          if not 1 < len(why_lines) <= 50000 or why_lines[0] != 'reference\textracted\tsymbol':
              raise SystemExit('native why-extract header')
          stats_matched = {name: [] for name in names}
          for line in stats_lines[1:]:
              fields = line.split('\t')
              if len(line) > 4096 or len(fields) != 3 or any(not re.fullmatch(r'[0-9]{1,20}', value) for value in fields[:2]) or not fields[2]:
                  raise SystemExit('native rlib stats grammar')
              count, extracted, raw = int(fields[0]), int(fields[1]), fields[2]
              if extracted > count:
                  raise SystemExit('native rlib stats counts')
              resolved = linked_path(raw)
              for name in names:
                  map_raw = next(iter(rlib_link_paths[name]))
                  if resolved is not None and resolved == linked_path(map_raw):
                      stats_matched[name].append((count, extracted, raw))
          for name in names:
              rows = stats_matched[name]
              if not 1 <= len(rows) <= 8 or any(count != len(billed[name + '_rlib']) for count, _, _ in rows):
                  raise SystemExit('native rlib stats identity')
              if not 0 < sum(extracted for _, extracted, _ in rows) <= len(billed[name + '_rlib']):
                  raise SystemExit('native rlib stats extracted count')
          extracted_rlib = {name: set() for name in names}
          for line in why_lines[1:]:
              fields = line.split('\t')
              if len(line) > 8192 or len(fields) != 3 or not all(fields) or '\x00' in line:
                  raise SystemExit('native why-extract grammar')
              extracted_field = fields[1]
              matched = []
              for name in names:
                  for _, _, raw in stats_matched[name]:
                      prefix = raw + '('
                      if extracted_field.startswith(prefix) and extracted_field.endswith(')'):
                          matched.append((name, extracted_field[len(prefix):-1]))
              if len(set(matched)) > 1:
                  raise SystemExit('native why-extract archive ambiguous')
              if matched:
                  name, member = matched[0]
                  member_hash = hashlib.sha256(member.encode()).hexdigest()
                  if not member or member_hash not in billed[name + '_rlib'] or member_hash in extracted_rlib[name]:
                      raise SystemExit('native why-extract member identity')
                  extracted_rlib[name].add(member_hash)
          for name in names:
              if len(extracted_rlib[name]) != sum(extracted for _, extracted, _ in stats_matched[name]):
                  raise SystemExit('native stats why-extract mismatch')
          extracted_native = {label: extracted_rlib[rlib.removesuffix('_rlib')] & set(billed[label])
                              for label, rlib in native_pairs.items()}
          if any(not selected_native[label] <= extracted_native[label] for label in native_pairs):
              raise SystemExit('native selected member extraction missing')
          ranges.sort()
          if any(left[1] > right[0] for left, right in zip(ranges, ranges[1:])):
              raise SystemExit('native file-backed ranges overlap')
          if any(counters[(name, 'file_bytes')] == 0 for name in names) or any(isc[stem] == 0 for stem in ('inet_ntop', 'inet_pton')):
              raise SystemExit('native file-backed witness missing')
          if any(not selected_native[label] or not selected_rows[label] for label in native_pairs):
              raise SystemExit('native original object map join missing')
          if lines != int(re.findall(r'^map_lines=([0-9]+)$', receipt.read_text(), re.M)[0]):
              raise SystemExit('native map changed after parse')
          with receipt.open('a') as output:
              print('native_file_backed_scope=LOCAL_MAP_PT_LOAD_PRESTRIP_STRIPPED_EQUAL', file=output)
              print('native_discarded_member_scope=UNPROVEN', file=output)
              print('native_original_object_scope=LOCAL_A_TO_RLIB_SELECTED_MAP_MEMBER_JOIN', file=output)
              print('native_original_object_selected_bytes=UNPROVEN', file=output)
              print('native_extraction_scope=LOCAL_LLD_STATS_WHY_EXACT_SET', file=output)
              print('native_extracted_no_filebacked_fate=UNKNOWN', file=output)
              print('native_unrecorded_member_fate=UNKNOWN', file=output)
              for name in names:
                  for field in ('map_rows', 'zero_rows', 'nonfile_rows', 'file_rows', 'file_bytes'):
                      print(f'{name}_{field}={counters[(name, field)]}', file=output)
                  print(f'{name}_file_members={len(members[name])}', file=output)
                  print(f'{name}_mapped_slice_digest={digests[name].hexdigest()}', file=output)
                  print(f'{name}_other_rlib_file_rows={counters[(name, "other_rlib_file_rows")]}', file=output)
              for label in sorted(native_pairs):
                  binding = hashlib.sha256()
                  for vma, size, name_hash, object_hash in sorted(selected_rows[label]):
                      binding.update(bytes.fromhex(name_hash) + bytes.fromhex(object_hash) +
                                     vma.to_bytes(8, 'little') + size.to_bytes(8, 'little'))
                  print(f'{label}_selected_map_members={len(selected_native[label])}', file=output)
                  print(f'{label}_selected_file_rows={counters[(label, "file_rows")]}', file=output)
                  print(f'{label}_selected_file_bytes={counters[(label, "file_bytes")]}', file=output)
                  print(f'{label}_selected_member_map_digest={binding.hexdigest()}', file=output)
                  print(f'{label}_extracted_members={len(extracted_native[label])}', file=output)
                  print(f'{label}_no_recorded_ordinary_extraction_members={len(billed[label]) - len(extracted_native[label])}', file=output)
                  print(f'{label}_extracted_no_filebacked_map_members={len(extracted_native[label] - selected_native[label])}', file=output)
              for name in names:
                  print(f'{name}_stats_extracted_members={len(extracted_rlib[name])}', file=output)
                  print(f'{name}_other_extracted_rlib_members={len(extracted_rlib[name] - set(native_by_rlib[name]))}', file=output)
              for stem in ('inet_ntop', 'inet_pton'):
                  print(f'isc_{stem}_file_bytes={isc[stem]}', file=output)
          PY
          printf '%s\n' TAR_STAGE > parity/stage.txt
          stage=agent-parity-diagnostic-x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/moth-parity/dist/$stage/THIRD_PARTY_NOTICES/native"
          cp target/x86_64-unknown-linux-gnu/release/agent "$RUNNER_TEMP/moth-parity/dist/$stage/"
          cp LICENSE README.md CHANGELOG.md "$RUNNER_TEMP/moth-parity/dist/$stage/"
          test "$(wc -l < packaging/native-notice-files.txt)" -eq 14
          test "$(sort -u packaging/native-notice-files.txt | wc -l)" -eq 14
          while IFS= read -r source; do
            case "$source" in vendor/*) ;; *) exit 1 ;; esac
            case "$source" in *..*|*//*) exit 1 ;; esac
            test -f "$source" && test ! -L "$source"
            target="$RUNNER_TEMP/moth-parity/dist/$stage/THIRD_PARTY_NOTICES/native/$source"
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
            cmp -s "$source" "$target"
          done < packaging/native-notice-files.txt
          cp packaging/native-notice-files.txt "$RUNNER_TEMP/moth-parity/dist/$stage/THIRD_PARTY_NOTICES/native/FILES.txt"
          tar -C "$RUNNER_TEMP/moth-parity/dist" -czf "$RUNNER_TEMP/moth-parity/candidate.tar.gz" "$stage"
          printf '%s\n' TAR_VERIFY > parity/stage.txt
          python3 - "$RUNNER_TEMP/moth-parity/candidate.tar.gz" "$stage" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          import tarfile

          archive, stage = sys.argv[1:]
          root = Path.cwd()
          names = (root / 'packaging/native-notice-files.txt').read_text().splitlines()
          assert len(names) == len(set(names)) == 14
          wanted = {'agent', 'LICENSE', 'README.md', 'CHANGELOG.md',
                    'THIRD_PARTY_NOTICES/native/FILES.txt'}
          wanted |= {f'THIRD_PARTY_NOTICES/native/{name}' for name in names}
          payload = root / 'release-payload/amd64'
          (payload / 'native').mkdir(parents=True)
          seen = set()
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar:
                  parts = member.name.rstrip('/').split('/')
                  assert parts[0] == stage and all(part not in ('', '.', '..') for part in parts)
                  if member.isdir():
                      continue
                  assert member.isfile() and member.size <= 100 * 1024 * 1024
                  relative = '/'.join(parts[1:])
                  assert relative in wanted and relative not in seen
                  seen.add(relative)
                  if relative == 'agent':
                      assert member.mode & 0o111
                      dest = payload / 'agent'
                  elif relative == 'LICENSE':
                      dest = payload / 'LICENSE'
                  elif relative.startswith('THIRD_PARTY_NOTICES/native/'):
                      dest = payload / 'native' / relative.removeprefix('THIRD_PARTY_NOTICES/native/')
                  else:
                      continue
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with tar.extractfile(member) as source, dest.open('wb') as output:
                      while chunk := source.read(1024 * 1024):
                          output.write(chunk)
                  dest.chmod(0o755 if relative == 'agent' else 0o644)
          assert seen == wanted
          assert (payload / 'LICENSE').read_bytes() == (root / 'LICENSE').read_bytes()
          assert (payload / 'native/FILES.txt').read_bytes() == (root / 'packaging/native-notice-files.txt').read_bytes()
          for name in names:
              assert (payload / 'native' / name).read_bytes() == (root / name).read_bytes()
          sha = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          (root / 'parity/tar-sha256.txt').write_text(
              f'tar_sha256={sha(archive)}\ntar_agent_sha256={sha(payload / "agent")}\n'
          )
          PY
          printf '%s\n' TAR_READY > parity/stage.txt

      - name: Build local release-only OCI and compare exported bytes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' OCI_BUILD > parity/stage.txt
          docker build --platform linux/amd64 --target runtime --file Dockerfile.release \
            --build-arg TARGETARCH=amd64 \
            --build-arg "REPO_SOURCE=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --tag moth-parity-runtime:diagnostic . > "$RUNNER_TEMP/moth-parity-oci.log" 2>&1
          docker image inspect --format 'runtime_image={{.Id}}' moth-parity-runtime:diagnostic > parity/image.txt
          printf '%s\n' OCI_EXPORT > parity/stage.txt
          container=$(docker create --platform linux/amd64 moth-parity-runtime:diagnostic)
          printf '%s\n' "$container" > "$RUNNER_TEMP/moth-parity/container-id"
          docker export "$container" > "$RUNNER_TEMP/moth-parity/rootfs.tar"
          printf '%s\n' OCI_COMPARE > parity/stage.txt
          python3 - "$RUNNER_TEMP/moth-parity/rootfs.tar" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          import tarfile

          root = Path.cwd()
          payload = root / 'release-payload/amd64'
          names = (root / 'packaging/native-notice-files.txt').read_text().splitlines()
          expected = {'usr/local/bin/agent': payload / 'agent',
                      'usr/share/licenses/moth/LICENSE': payload / 'LICENSE',
                      'usr/share/doc/moth/THIRD_PARTY_NOTICES/native/FILES.txt': payload / 'native/FILES.txt'}
          expected.update({f'usr/share/doc/moth/THIRD_PARTY_NOTICES/native/{name}': payload / 'native' / name
                           for name in names})
          oci_agent_hash = None
          with tarfile.open(sys.argv[1], 'r:') as tar:
              members = tar.getmembers()
              for path, source in expected.items():
                  matching = [m for m in members if m.name.removeprefix('./') == path]
                  assert len(matching) == 1 and matching[0].isfile(), path
                  observed = hashlib.sha256(tar.extractfile(matching[0]).read()).hexdigest()
                  assert observed == hashlib.sha256(source.read_bytes()).hexdigest(), path
                  if path == 'usr/local/bin/agent':
                      oci_agent_hash = observed
              native_prefix = 'usr/share/doc/moth/THIRD_PARTY_NOTICES/native/'
              native = [m for m in members if m.name.removeprefix('./').startswith(native_prefix) and m.isfile()]
              assert len(native) == 15
          text_paths = sorted(path for path in expected if path != 'usr/local/bin/agent')
          with (root / 'parity/text-sha256.txt').open('w') as receipt:
              for path in text_paths:
                  print(hashlib.sha256(expected[path].read_bytes()).hexdigest(), path, file=receipt)
          with (root / 'parity/tar-sha256.txt').open('a') as receipt:
              print('oci_agent_sha256=' + oci_agent_hash, file=receipt)
              print('tar_oci_binary_identity=yes', file=receipt)
          PY
          printf '%s\n' OCI_READY > parity/stage.txt

      - name: Mark local release-layout parity diagnostic complete
        id: parity-complete
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < parity/text-sha256.txt)" -eq 16
          grep -Fxq 'tar_oci_binary_identity=yes' parity/tar-sha256.txt
          test -s parity/map-join.txt
          test "$(grep -c '^stripped_agent_sha256=' parity/map-join.txt)" -eq 1
          test "$(grep -c '^tar_agent_sha256=' parity/tar-sha256.txt)" -eq 1
          test "$(sed -n 's/^stripped_agent_sha256=//p' parity/map-join.txt)" = "$(sed -n 's/^tar_agent_sha256=//p' parity/tar-sha256.txt)"
          grep -Fxq 'native_file_backed_scope=LOCAL_MAP_PT_LOAD_PRESTRIP_STRIPPED_EQUAL' parity/map-join.txt
          grep -Fxq 'native_discarded_member_scope=UNPROVEN' parity/map-join.txt
          grep -Fxq 'native_original_object_scope=LOCAL_A_TO_RLIB_SELECTED_MAP_MEMBER_JOIN' parity/map-join.txt
          grep -Fxq 'native_original_object_selected_bytes=UNPROVEN' parity/map-join.txt
          grep -Fxq 'native_extraction_scope=LOCAL_LLD_STATS_WHY_EXACT_SET' parity/map-join.txt
          grep -Fxq 'native_extracted_no_filebacked_fate=UNKNOWN' parity/map-join.txt
          grep -Fxq 'native_unrecorded_member_fate=UNKNOWN' parity/map-join.txt
          for label in crypto_a curl_a ssl_a z_a; do
            grep -Eq "^${label}_selected_map_members=[1-9][0-9]*$" parity/map-join.txt
            grep -Eq "^${label}_selected_file_rows=[1-9][0-9]*$" parity/map-join.txt
            grep -Eq "^${label}_extracted_members=[1-9][0-9]*$" parity/map-join.txt
            grep -Eq "^${label}_section_alloc_sections=[1-9][0-9]*$" parity/native-inventory.txt
          done
          grep -Fxq 'full_allocated_section_reconciliation=UNPROVEN' parity/native-inventory.txt
          grep -Fxq 'same_build_archive_inventory=yes' parity/native-inventory.txt
          grep -Fxq 'native_section_shape_scope=ORIGINAL_A_CENSUS_ONLY' parity/native-inventory.txt
          grep -Fxq 'native_allocated_section_fate=UNKNOWN' parity/native-inventory.txt
          grep -Fxq 'native_a_link_input_identity=LLD21_STATS_POSITIVE_ONLY' parity/native-inventory.txt
          test -s parity/native-members.txt
          grep -Fxq 'schema=moth-local-native-member-hashes/v1' parity/native-members.txt
          for stem in inet_ntop inet_pton; do
            grep -Eq "^isc_${stem}_object_sha256=[0-9a-f]{64}$" parity/native-inventory.txt
          done
          grep -Eq '^isc_inet_ntop_file_bytes=[1-9][0-9]*$' parity/map-join.txt
          grep -Eq '^isc_inet_pton_file_bytes=[1-9][0-9]*$' parity/map-join.txt
          for source in vendor/curl-sys/curl/LICENSES/ISC.txt vendor/curl-sys/curl/lib/curlx/inet_ntop.c vendor/curl-sys/curl/lib/curlx/inet_pton.c; do
            test "$(grep -Fc " usr/share/doc/moth/THIRD_PARTY_NOTICES/native/$source" parity/text-sha256.txt)" -eq 1
          done
          printf '%s\n' COMPLETE > parity/stage.txt

      - name: Remove private parity payloads and containers
        if: always()
        shell: bash
        env:
          PARITY_OUTCOME: ${{ steps.parity-complete.outcome }}
        run: |
          set -uo pipefail
          cleanup_ok=1
          if test -s "$RUNNER_TEMP/moth-parity/cargo-container-id"; then
            cargo_container="$(cat "$RUNNER_TEMP/moth-parity/cargo-container-id")"
            if docker container inspect "$cargo_container" >/dev/null 2>&1; then
              docker rm -f "$cargo_container" >/dev/null || cleanup_ok=0
            fi
          fi
          if test -s "$RUNNER_TEMP/moth-parity/container-id"; then
            docker rm -f "$(cat "$RUNNER_TEMP/moth-parity/container-id")" >/dev/null || cleanup_ok=0
          fi
          sudo -n rm -rf -- "$RUNNER_TEMP/moth-parity" "$GITHUB_WORKSPACE/release-payload" "$GITHUB_WORKSPACE/target" || cleanup_ok=0
          rm -f -- agent-native-link.map agent-native-why-extract.txt agent-native-archive-stats.txt || cleanup_ok=0
          rm -f -- "$RUNNER_TEMP/moth-parity-builder.log" "$RUNNER_TEMP/moth-parity-rustc-version.log" "$RUNNER_TEMP/moth-parity-rustc-identity.log" "$RUNNER_TEMP/moth-parity-linker-identity.log" "$RUNNER_TEMP/moth-parity-cargo.log" "$RUNNER_TEMP/moth-parity-oci.log" || cleanup_ok=0
          for private in agent-native-link.map agent-native-why-extract.txt agent-native-archive-stats.txt "$GITHUB_WORKSPACE/target" \
            "$RUNNER_TEMP/moth-parity" "$GITHUB_WORKSPACE/release-payload" \
            "$RUNNER_TEMP/moth-parity-builder.log" "$RUNNER_TEMP/moth-parity-rustc-version.log" "$RUNNER_TEMP/moth-parity-rustc-identity.log" "$RUNNER_TEMP/moth-parity-linker-identity.log" "$RUNNER_TEMP/moth-parity-cargo.log" "$RUNNER_TEMP/moth-parity-oci.log"; do
            { test ! -e "$private" && test ! -L "$private"; } || cleanup_ok=0
          done
          test "$cleanup_ok" -eq 1 || exit 1
          test "$PARITY_OUTCOME" = success || exit 0
          test -d parity && test ! -L parity && test -f parity/status.txt && test ! -L parity/status.txt || exit 1
          printf '%s\n' 'INCOMPLETE' 'release_admission=NO' 'legal_admission=NO' | cmp -s - parity/status.txt || exit 1
          test ! -e parity/status.pending && test ! -L parity/status.pending || exit 1
          printf '%s\n' 'LOCAL_NATIVE_MAP_RELEASE_LAYOUT_JOIN_ONLY' 'release_admission=NO' 'legal_admission=NO' 'pushed_image_parity=UNPROVEN' 'native_link_retention=LOCAL_LLD_ROWS_OBSERVED' 'selected_native_bytes=UNPROVEN' 'notice_custody=LOCAL_14_SOURCE_TAR_OCI_BYTE_JOIN' 'base_image_notice_coverage=UNPROVEN' > parity/status.pending || exit 1
          test -f parity/status.pending && test ! -L parity/status.pending || exit 1
          printf '%s\n' 'LOCAL_NATIVE_MAP_RELEASE_LAYOUT_JOIN_ONLY' 'release_admission=NO' 'legal_admission=NO' 'pushed_image_parity=UNPROVEN' 'native_link_retention=LOCAL_LLD_ROWS_OBSERVED' 'selected_native_bytes=UNPROVEN' 'notice_custody=LOCAL_14_SOURCE_TAR_OCI_BYTE_JOIN' 'base_image_notice_coverage=UNPROVEN' | cmp -s - parity/status.pending || exit 1
          mv -f -- parity/status.pending parity/status.txt || exit 1

      - name: Bound text-only parity receipt
        id: bound-parity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d parity && test ! -L parity
          test -f parity/status.txt
          test "$(find parity -type f | wc -l)" -le 9
          test -z "$(find parity ! -type f ! -type d -print -quit)"
          while IFS= read -r path; do
            case "$path" in
              parity/status.txt|parity/identity.txt|parity/tar-sha256.txt|parity/image.txt|parity/text-sha256.txt|parity/map-join.txt|parity/native-inventory.txt|parity/native-members.txt|parity/stage.txt) ;;
              *) exit 1 ;;
            esac
            case "$path" in
              parity/native-members.txt) test "$(wc -c < "$path")" -le 1048576 ;;
              *) test "$(wc -c < "$path")" -le 8192 ;;
            esac
          done < <(find parity -type f -print)
          if test -f parity/stage.txt; then
            test "$(wc -l < parity/stage.txt)" -eq 1
            test "$(wc -c < parity/stage.txt)" -le 32
            case "$(cat parity/stage.txt)" in
              BUILDER_IMAGE|RUSTC_IDENTITY|LINKER_IDENTITY|CARGO_LINK_MAP|MAP_PARSE|ARCHIVE_INVENTORY|STRIP|NATIVE_BYTES|TAR_STAGE|TAR_VERIFY|TAR_READY|OCI_BUILD|OCI_EXPORT|OCI_COMPARE|OCI_READY|COMPLETE) ;;
              *) exit 1 ;;
            esac
          fi
          test "$(du -sk parity | cut -f1)" -le 1152

      - name: Retain parity diagnostic receipt
        if: ${{ always() && steps.bound-parity.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moth-pr8-release-layout-parity-${{ github.sha }}
          path: parity/
          if-no-files-found: error
          retention-days: 7

  base-custody-linux:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/native-notice-packaging-pr5' && inputs.base_custody && !inputs.release_parity
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Fetch exact reviewed PR8 source for no-publish base rehearsal
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.notice_head_sha }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          mkdir -p base-receipt
          printf '%s\n' 'INCOMPLETE' 'release_admission=NO' 'legal_admission=NO' > base-receipt/status.txt
          printf '%s\n' FETCH > base-receipt/stage.txt
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name base-receipt -print -quit)"
          git init -q "$GITHUB_WORKSPACE"
          git remote add origin https://github.com/ryanmaclean/moth.git
          git -c credential.helper= fetch --no-tags --no-recurse-submodules --depth=128 origin refs/pull/8/head
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA"
          git -c submodule.recurse=false checkout --detach --force "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git merge-base HEAD 2ad30129a9af231b687b8821f2b9d062e41992f9)" = 2ad30129a9af231b687b8821f2b9d062e41992f9
          git diff --name-only 2ad30129a9af231b687b8821f2b9d062e41992f9 HEAD | sort | diff -u <(printf '%s\n' '.github/workflows/freebsd.yml' '.github/workflows/release.yml' 'Dockerfile' 'Dockerfile.release' 'packaging/native-notice-files.txt' | sort) -
          printf '%s\n' \
            'befd91e188696989d415870792acb3f9fa5a5d3bd79fe8823989264714b6fe51  Cargo.lock' \
            '392a5a80e863151504fa05add58ea97b98a4a7a57e36cd26436734a95465650a  Dockerfile' \
            '8aecec600179b49cd5a1a8a4feede8e86c1fa2717c75752827201f476bf0ef4a  Dockerfile.release' \
            'ae3f5acdad3187723f7779ae725467a51d80e2609f6c509c8ab43c935b3f58a6  .github/workflows/release.yml' \
            '6321279cc4a58259e29638a1f7c6621184b07576e8a70728b2b5bb48d761d83c  packaging/native-notice-files.txt' \
            '59d5f1cb240a41f1a4acea088ca1f964b0e9d81c6afea1cc748988f5bdb1a533  .dockerignore' \
            | sha256sum --check --status
          grep -Fxq 'FROM gcr.io/distroless/cc-debian12@sha256:e5d81ddde149641e2a9ba55be4545bc125c67de07508b03ba4c22e6eb0ded5aa AS runtime' Dockerfile.release
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'source_head=%s\nbase_index=sha256:e5d81ddde149641e2a9ba55be4545bc125c67de07508b03ba4c22e6eb0ded5aa\n' "$REVIEWED_SHA" > base-receipt/identity.txt

      - name: Build two same-run release-layout payloads and private local images
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/moth-base-custody"
          mkdir -p "$private" release-payload
          capture() {
            local destination="$1" limit="$2"
            shift 2
            if ! "$@" 2>&1 | head -c "$((limit + 1))" > "$destination"; then
              echo 'base custody private command failed or exceeded cap' >&2
              exit 1
            fi
            if test "$(wc -c < "$destination")" -gt "$limit"; then
              echo 'base custody private command exceeded cap' >&2
              exit 1
            fi
          }
          capture_archive() {
            local destination="$1" limit="$2"
            shift 2
            if ! "$@" 2>/dev/null | head -c "$((limit + 1))" > "$destination"; then
              echo 'base custody private archive failed or exceeded cap' >&2
              exit 1
            fi
            if test "$(wc -c < "$destination")" -gt "$limit"; then
              echo 'base custody private archive exceeded cap' >&2
              exit 1
            fi
          }
          printf '%s\n' BASE_INDEX > base-receipt/stage.txt
          capture "$private/base-index.json" 1048576 docker buildx imagetools inspect --raw gcr.io/distroless/cc-debian12@sha256:e5d81ddde149641e2a9ba55be4545bc125c67de07508b03ba4c22e6eb0ded5aa
          jq -e '([.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .platform.architecture] | sort) == ["amd64", "arm64"]' "$private/base-index.json" >/dev/null
          printf '%s\n' BUILDER > base-receipt/stage.txt
          capture "$private/builder.log" 4194304 docker build --target builder -t moth-base-custody-builder:local .
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}" target="${pair#*:}"
            case "$arch" in amd64) suffix=AMD64 ;; arm64) suffix=ARM64 ;; *) exit 1 ;; esac
            printf 'BUILD_%s\n' "$suffix" > base-receipt/stage.txt
            capture "$private/build-$arch.log" 16777216 timeout 45m docker run --rm -v "$PWD:/work" -w /work moth-base-custody-builder:local \
              cargo build --release --locked --frozen --offline -p cli --target "$target"
            if test "$arch" = arm64; then strip_cmd='aarch64-linux-gnu-strip'; else strip_cmd='strip'; fi
            printf 'STRIP_%s\n' "$suffix" > base-receipt/stage.txt
            capture "$private/strip-$arch.log" 1048576 docker run --rm -v "$PWD:/work" -w /work moth-base-custody-builder:local \
              "$strip_cmd" "target/$target/release/agent"
            mkdir -p "release-payload/$arch/native" "$private/stage-$arch/THIRD_PARTY_NOTICES/native"
            cp "target/$target/release/agent" "release-payload/$arch/agent"
            cp LICENSE "release-payload/$arch/LICENSE"
            cp packaging/native-notice-files.txt "release-payload/$arch/native/FILES.txt"
            cp "release-payload/$arch/agent" "$private/stage-$arch/agent"
            cp LICENSE README.md CHANGELOG.md "$private/stage-$arch/"
            cp packaging/native-notice-files.txt "$private/stage-$arch/THIRD_PARTY_NOTICES/native/FILES.txt"
            while IFS= read -r source; do
              case "$source" in vendor/*) ;; *) exit 1 ;; esac
              case "$source" in *..*|*//*) exit 1 ;; esac
              test -f "$source" && test ! -L "$source"
              mkdir -p "release-payload/$arch/native/$(dirname "$source")" "$private/stage-$arch/THIRD_PARTY_NOTICES/native/$(dirname "$source")"
              cp "$source" "release-payload/$arch/native/$source"
              cp "$source" "$private/stage-$arch/THIRD_PARTY_NOTICES/native/$source"
            done < packaging/native-notice-files.txt
            printf 'TAR_%s\n' "$suffix" > base-receipt/stage.txt
            capture_archive "$private/candidate-$arch.tar.gz" 134217728 tar -C "$private" -czf - "stage-$arch"
            printf 'IMAGE_BUILD_%s\n' "$suffix" > base-receipt/stage.txt
            capture "$private/image-$arch.log" 4194304 docker build --platform "linux/$arch" --file Dockerfile.release \
              --build-arg TARGETARCH="$arch" --build-arg SOURCE_REVISION="$GITHUB_SHA" \
              -t "moth-base-custody-$arch:local" .
            printf 'BASE_MANIFEST_%s\n' "$suffix" > base-receipt/stage.txt
            digest=$(jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else empty end' "$private/base-index.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if test "$arch" = amd64; then
              test "$digest" = sha256:6dc8478fd8e790ae427aeff51e588573dec83b13adb7e5d10505a717927009b5
            else
              test "$digest" = sha256:4bed9c8eff0e70bf6547aa04a3b1ea5bba63fb910707b3f94f45556edc2a9238
            fi
            printf '%s_base_manifest=%s\n' "$arch" "$digest" >> base-receipt/identity.txt
            printf 'BASE_PULL_%s\n' "$suffix" > base-receipt/stage.txt
            capture "$private/pull-$arch.log" 1048576 docker pull --platform "linux/$arch" "gcr.io/distroless/cc-debian12@$digest"
            printf 'BASE_CREATE_%s\n' "$suffix" > base-receipt/stage.txt
            capture "$private/create-base-$arch.log" 1048576 docker create --name "moth-base-custody-base-$arch" --platform "linux/$arch" "gcr.io/distroless/cc-debian12@$digest"
            printf 'IMAGE_CREATE_%s\n' "$suffix" > base-receipt/stage.txt
            capture "$private/create-image-$arch.log" 1048576 docker create --name "moth-base-custody-image-$arch" --platform "linux/$arch" "moth-base-custody-$arch:local"
            printf 'BASE_EXPORT_%s\n' "$suffix" > base-receipt/stage.txt
            capture_archive "$private/base-$arch.tar" 268435456 docker export "moth-base-custody-base-$arch"
            printf 'IMAGE_EXPORT_%s\n' "$suffix" > base-receipt/stage.txt
            capture_archive "$private/image-$arch.tar" 268435456 docker export "moth-base-custody-image-$arch"
          done

      - name: Compare private tar, base and composed bytes with bounded receipt
        id: custody-complete
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' CUSTODY > base-receipt/stage.txt
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile

          private = Path(os.environ['RUNNER_TEMP']) / 'moth-base-custody'
          manifest = Path('packaging/native-notice-files.txt').read_text().splitlines()
          def require(condition):
              if not condition:
                  raise SystemExit('base custody mismatch') from None
          def snapshot(path):
              result = {}
              require(path.is_file() and 0 < path.stat().st_size <= 268435456)
              with tarfile.open(path, 'r:') as archive:
                  for member in archive:
                      name = member.name.removeprefix('./').lstrip('/')
                      require(len(name) <= 4096 and '..' not in name.split('/'))
                      require(len(result) < 50000)
                      require(name not in result)
                      if member.isfile():
                          require(0 <= member.size <= 100 * 1024 * 1024)
                          stream = archive.extractfile(member)
                          require(stream is not None)
                          digest = hashlib.sha256()
                          while chunk := stream.read(1024 * 1024):
                              digest.update(chunk)
                          result[name] = ('file', member.size, digest.hexdigest())
                      else:
                          result[name] = ('other', 0, '')
              return result
          def local(path):
              require(path.is_file() and not path.is_symlink())
              data = path.read_bytes()
              require(len(data) <= 100 * 1024 * 1024)
              return ('file', len(data), hashlib.sha256(data).hexdigest())
          try:
              require(len(manifest) == len(set(manifest)) == 14)
              with Path('base-receipt/custody.txt').open('w', encoding='ascii') as out:
                  print('schema=moth-local-base-custody/v1', file=out)
                  for arch in ('amd64', 'arm64'):
                      base = snapshot(private / f'base-{arch}.tar')
                      image = snapshot(private / f'image-{arch}.tar')
                      require(0 < (private / f'candidate-{arch}.tar.gz').stat().st_size <= 134217728)
                      with tarfile.open(private / f'candidate-{arch}.tar.gz', 'r:gz') as archive:
                          tar_members = {}
                          for member in archive:
                              if member.isfile():
                                  require(len(member.name) <= 4096 and '..' not in member.name.split('/'))
                                  require(member.name not in tar_members and member.size <= 100 * 1024 * 1024)
                                  stream = archive.extractfile(member)
                                  require(stream is not None)
                                  data = stream.read()
                                  tar_members[member.name] = ('file', len(data), hashlib.sha256(data).hexdigest())
                      payload = Path('release-payload') / arch
                      wanted = {'usr/local/bin/agent': payload / 'agent',
                                'usr/share/licenses/moth/LICENSE': payload / 'LICENSE',
                                'usr/share/doc/moth/THIRD_PARTY_NOTICES/native/FILES.txt': payload / 'native/FILES.txt'}
                      wanted.update({f'usr/share/doc/moth/THIRD_PARTY_NOTICES/native/{name}': payload / 'native' / name for name in manifest})
                      require(len(tar_members) == len(wanted) + 2)
                      for extra in ('README.md', 'CHANGELOG.md'):
                          require(tar_members.get(f'stage-{arch}/{extra}') == local(Path(extra)))
                      for dest, source in wanted.items():
                          require(image.get(dest) == local(source))
                          relative = dest.replace('usr/local/bin/', '').replace('usr/share/licenses/moth/', '').replace('usr/share/doc/moth/', '')
                          require(tar_members.get(f'stage-{arch}/{relative}') == local(source))
                      native_prefix = 'usr/share/doc/moth/THIRD_PARTY_NOTICES/native/'
                      require(sum(k.startswith(native_prefix) and v[0] == 'file' for k, v in image.items()) == 15)
                      notice = {k: v for k, v in base.items() if v[0] == 'file' and (
                          (k.startswith('usr/share/doc/') and
                           k.rsplit('/', 1)[-1].lower().startswith(('copyright', 'license', 'copying', 'notice'))) or
                          k.startswith('usr/share/licenses/') or k.startswith('licenses/'))}
                      package_meta = {k: v for k, v in base.items() if v[0] == 'file' and (
                          k.startswith('var/lib/dpkg/status.d/') or k == 'var/lib/dpkg/status' or
                          k.endswith('.spdx.json') or k.endswith('.spdx'))}
                      require(0 < len(notice) <= 4096 and 0 < len(package_meta) <= 4096)
                      require(all(image.get(k) == v for k, v in notice.items()))
                      require(all(image.get(k) == v for k, v in package_meta.items()))
                      print(f'{arch}_agent_sha256={local(payload / "agent")[2]}', file=out)
                      print(f'{arch}_native_notice_files=15', file=out)
                      print(f'{arch}_base_notice_paths_inherited={len(notice)}', file=out)
                      print(f'{arch}_base_package_metadata_paths_inherited={len(package_meta)}', file=out)
                  print('base_notice_inheritance=EXACT_PATH_BYTES_FOR_OBSERVED_FILES', file=out)
                  print('base_package_notice_coverage=UNPROVEN', file=out)
                  print('pushed_image_parity=UNPROVEN', file=out)
          except Exception:
              raise SystemExit('base custody private data invalid') from None
          PY
          printf '%s\n' VERIFIED > base-receipt/stage.txt

      - name: Remove private base rehearsal payloads and containers
        if: always()
        shell: bash
        env:
          CUSTODY_OUTCOME: ${{ steps.custody-complete.outcome }}
        run: |
          set -uo pipefail
          ok=1
          for arch in amd64 arm64; do
            docker rm -f "moth-base-custody-base-$arch" "moth-base-custody-image-$arch" >/dev/null 2>&1 || true
            docker image rm -f "moth-base-custody-$arch:local" >/dev/null 2>&1 || true
            docker container inspect "moth-base-custody-base-$arch" >/dev/null 2>&1 && ok=0
            docker container inspect "moth-base-custody-image-$arch" >/dev/null 2>&1 && ok=0
            docker image inspect "moth-base-custody-$arch:local" >/dev/null 2>&1 && ok=0
          done
          docker image rm -f moth-base-custody-builder:local >/dev/null 2>&1 || true
          docker image inspect moth-base-custody-builder:local >/dev/null 2>&1 && ok=0
          sudo -n rm -rf -- "$RUNNER_TEMP/moth-base-custody" "$GITHUB_WORKSPACE/release-payload" "$GITHUB_WORKSPACE/target" || ok=0
          for private in "$RUNNER_TEMP/moth-base-custody" "$GITHUB_WORKSPACE/release-payload" "$GITHUB_WORKSPACE/target"; do
            { test ! -e "$private" && test ! -L "$private"; } || ok=0
          done
          test "$ok" -eq 1 || exit 1
          test "$CUSTODY_OUTCOME" = success || exit 0
          test -f base-receipt/custody.txt && test ! -L base-receipt/custody.txt || exit 1
          printf '%s\n' 'LOCAL_TWO_ARCH_BASE_INHERITANCE_ONLY' 'release_admission=NO' 'legal_admission=NO' 'base_package_notice_coverage=UNPROVEN' 'pushed_image_parity=UNPROVEN' > base-receipt/status.pending || exit 1
          mv -f -- base-receipt/status.pending base-receipt/status.txt || exit 1
          printf '%s\n' COMPLETE > base-receipt/stage.txt

      - name: Bound base custody text receipt
        id: bound-base
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d base-receipt && test ! -L base-receipt
          test -f base-receipt/status.txt && test ! -L base-receipt/status.txt
          test "$(find base-receipt -type f | wc -l)" -le 4
          test -z "$(find base-receipt ! -type f ! -type d -print -quit)"
          while IFS= read -r path; do
            case "$path" in base-receipt/status.txt|base-receipt/stage.txt|base-receipt/identity.txt|base-receipt/custody.txt) ;; *) exit 1 ;; esac
            test "$(wc -c < "$path")" -le 2048
            test -s "$path"
            if LC_ALL=C grep -qvE '^[A-Za-z0-9_=/:-]+$' "$path"; then exit 1; fi
          done < <(find base-receipt -type f -print)
          case "$(cat base-receipt/stage.txt)" in
            FETCH|BASE_INDEX|BUILDER|BUILD_AMD64|BUILD_ARM64|STRIP_AMD64|STRIP_ARM64|TAR_AMD64|TAR_ARM64|IMAGE_BUILD_AMD64|IMAGE_BUILD_ARM64|BASE_MANIFEST_AMD64|BASE_MANIFEST_ARM64|BASE_PULL_AMD64|BASE_PULL_ARM64|BASE_CREATE_AMD64|BASE_CREATE_ARM64|IMAGE_CREATE_AMD64|IMAGE_CREATE_ARM64|BASE_EXPORT_AMD64|BASE_EXPORT_ARM64|IMAGE_EXPORT_AMD64|IMAGE_EXPORT_ARM64|CUSTODY|VERIFIED|COMPLETE) ;;
            *) exit 1 ;;
          esac
          test "$(du -sk base-receipt | cut -f1)" -le 16

      - name: Retain bounded base custody receipt
        if: ${{ always() && steps.bound-base.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moth-pr8-base-custody-${{ github.sha }}
          path: base-receipt/
          if-no-files-found: error
          retention-days: 7
